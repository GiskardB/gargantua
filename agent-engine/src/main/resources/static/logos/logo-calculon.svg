<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8c6db"/>
      <stop offset="100%" style="stop-color:#8e99a9"/>
    </linearGradient>
    <linearGradient id="cshine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dce3ed;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#dce3ed;stop-opacity:0"/>
    </linearGradient>
    <filter id="csh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4a5568" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Warm light background -->
  <rect width="512" height="512" rx="60" fill="#faf5ef"/>

  <!-- Body/neck -->
  <rect x="210" y="380" width="92" height="50" rx="10" fill="#8e99a9" stroke="#6b7a8d" stroke-width="2"/>
  <rect x="190" y="420" width="132" height="20" rx="8" fill="#a0aab8" stroke="#6b7a8d" stroke-width="1.5"/>

  <!-- Head -->
  <rect x="130" y="90" width="252" height="300" rx="50" fill="url(#cface)" stroke="#6b7a8d" stroke-width="2.5" filter="url(#csh)"/>

  <!-- Metallic shine -->
  <ellipse cx="220" cy="160" rx="70" ry="50" fill="url(#cshine)"/>

  <!-- Antenna -->
  <line x1="256" y1="90" x2="256" y2="48" stroke="#8e99a9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="40" r="12" fill="#ff6b6b" stroke="#ee5a5a" stroke-width="2">
    <animate attributeName="fill" values="#ff6b6b;#ff9ff3;#ff6b6b" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Eyes — big, expressive, friendly -->
  <!-- Left eye -->
  <ellipse cx="200" cy="195" rx="40" ry="45" fill="white" stroke="#6b7a8d" stroke-width="2"/>
  <circle cx="205" cy="195" r="20" fill="#2d3436">
    <animate attributeName="cx" values="200;210;200" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="188" r="8" fill="white"/>
  <circle cx="200" cy="198" r="4" fill="white" opacity="0.5"/>

  <!-- Right eye -->
  <ellipse cx="312" cy="195" rx="40" ry="45" fill="white" stroke="#6b7a8d" stroke-width="2"/>
  <circle cx="317" cy="195" r="20" fill="#2d3436">
    <animate attributeName="cx" values="312;322;312" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="322" cy="188" r="8" fill="white"/>
  <circle cx="312" cy="198" r="4" fill="white" opacity="0.5"/>

  <!-- Eyebrows — raised, friendly expression -->
  <path d="M162 150 Q200 128 240 145" fill="none" stroke="#5a6572" stroke-width="4" stroke-linecap="round"/>
  <path d="M272 145 Q312 128 350 150" fill="none" stroke="#5a6572" stroke-width="4" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="155" cy="245" rx="20" ry="12" fill="#ffb8b8" opacity="0.5"/>
  <ellipse cx="357" cy="245" rx="20" ry="12" fill="#ffb8b8" opacity="0.5"/>

  <!-- Mouth — big friendly smile -->
  <path d="M195 290 Q256 350 317 290" fill="none" stroke="#5a6572" stroke-width="4" stroke-linecap="round"/>

  <!-- Teeth showing in smile -->
  <rect x="225" y="290" width="62" height="22" rx="4" fill="white" stroke="#b8c6db" stroke-width="1"/>
  <line x1="245" y1="290" x2="245" y2="312" stroke="#dce3ed" stroke-width="1"/>
  <line x1="265" y1="290" x2="265" y2="312" stroke="#dce3ed" stroke-width="1"/>

  <!-- Side ear panels (small, cute) -->
  <rect x="108" y="185" width="22" height="40" rx="8" fill="#a0aab8" stroke="#6b7a8d" stroke-width="1.5"/>
  <rect x="382" y="185" width="22" height="40" rx="8" fill="#a0aab8" stroke="#6b7a8d" stroke-width="1.5"/>
  <circle cx="119" cy="205" r="4" fill="#6b7a8d"/>
  <circle cx="393" cy="205" r="4" fill="#6b7a8d"/>

  <!-- Chest badge with G -->
  <circle cx="256" cy="442" r="16" fill="#6c5ce7" stroke="#5a4bd1" stroke-width="2"/>
  <text x="256" y="449" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="800" fill="white">G</text>

  <!-- Title -->
  <text x="256" y="488" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700" fill="#5a6572" letter-spacing="3">GARGANTUA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="cglow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cscreen"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0a0f0d"/>

  <!-- Robot head shape -->
  <rect x="130" y="100" width="252" height="280" rx="40" fill="url(#cg2)" stroke="#00b894" stroke-width="2.5"/>

  <!-- Antenna -->
  <line x1="256" y1="100" x2="256" y2="60" stroke="#636e72" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="52" r="10" fill="#00b894">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Eyes (screens) -->
  <rect x="165" y="155" width="72" height="50" rx="12" fill="#0a0f0d" stroke="#00b894" stroke-width="2"/>
  <rect x="275" y="155" width="72" height="50" rx="12" fill="#0a0f0d" stroke="#00b894" stroke-width="2"/>

  <!-- Eye pupils (glowing) -->
  <circle cx="201" cy="180" r="14" fill="#00b894" filter="url(#cscreen)" opacity="0.9">
    <animate attributeName="cx" values="196;206;196" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="311" cy="180" r="14" fill="#55efc4" filter="url(#cscreen)" opacity="0.9">
    <animate attributeName="cx" values="306;316;306" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Eyebrows (expressive like Calculon) -->
  <line x1="160" y1="148" x2="240" y2="140" stroke="#00b894" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="140" x2="352" y2="148" stroke="#00b894" stroke-width="3" stroke-linecap="round"/>

  <!-- Mouth area — screen with G -->
  <rect x="180" y="240" width="152" height="80" rx="15" fill="#0a0f0d" stroke="#00b894" stroke-width="2"/>

  <!-- G on mouth screen -->
  <text x="256" y="296" text-anchor="middle" font-family="'Courier New',monospace" font-size="58" font-weight="700" fill="url(#cg1)" filter="url(#cglow)">G</text>

  <!-- Scan line on mouth screen -->
  <rect x="182" y="242" width="148" height="3" fill="#55efc4" opacity="0.15" rx="1">
    <animate attributeName="y" values="242;316;242" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Side bolts -->
  <circle cx="140" cy="200" r="8" fill="#636e72" stroke="#00b894" stroke-width="1.5"/>
  <circle cx="372" cy="200" r="8" fill="#636e72" stroke="#00b894" stroke-width="1.5"/>

  <!-- Ear panels -->
  <rect x="100" y="170" width="30" height="60" rx="8" fill="#2d3436" stroke="#00b894" stroke-width="1.5"/>
  <rect x="382" y="170" width="30" height="60" rx="8" fill="#2d3436" stroke="#00b894" stroke-width="1.5"/>

  <!-- Jaw line -->
  <path d="M160 380 Q256 420 352 380" fill="none" stroke="#636e72" stroke-width="2"/>

  <!-- Neck -->
  <rect x="220" y="380" width="72" height="30" rx="5" fill="#2d3436" stroke="#636e72" stroke-width="1.5"/>

  <!-- Title -->
  <text x="256" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="#00b894" letter-spacing="4">GARGANTUA</text>
  <text x="256" y="484" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#636e72" letter-spacing="2">AI AGENT FRAMEWORK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="rg2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
    <linearGradient id="rflame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="40%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:0"/>
    </linearGradient>
    <filter id="rglow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Space background -->
  <rect width="512" height="512" rx="80" fill="#0c0c1a"/>

  <!-- Stars -->
  <circle cx="80" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="420" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="60" cy="300" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="450" cy="350" r="1" fill="white" opacity="0.6"/>
  <circle cx="150" cy="430" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="380" cy="450" r="1" fill="white" opacity="0.5"/>
  <circle cx="100" cy="170" r="1" fill="white" opacity="0.4"/>
  <circle cx="430" cy="180" r="1.5" fill="white" opacity="0.3"/>

  <!-- Rocket body -->
  <path d="M256 80 C230 120, 215 200, 215 280 L215 340 L256 370 L297 340 L297 280 C297 200, 282 120, 256 80Z"
        fill="url(#rg2)" stroke="#f39c12" stroke-width="1.5" opacity="0.9"/>

  <!-- Rocket window -->
  <circle cx="256" cy="200" r="28" fill="#0c0c1a" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="256" cy="200" r="20" fill="#1a1a2e" stroke="#f39c12" stroke-width="1"/>

  <!-- G inside window -->
  <text x="256" y="212" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="32" font-weight="800" fill="#f39c12" filter="url(#rglow)">G</text>

  <!-- Side fins -->
  <path d="M215 300 L170 360 L215 340Z" fill="#e74c3c" opacity="0.8"/>
  <path d="M297 300 L342 360 L297 340Z" fill="#e74c3c" opacity="0.8"/>

  <!-- Flame -->
  <ellipse cx="256" cy="395" rx="25" ry="45" fill="url(#rflame)" opacity="0.9">
    <animate attributeName="ry" values="40;50;40" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="256" cy="390" rx="15" ry="30" fill="#f1c40f" opacity="0.7">
    <animate attributeName="ry" values="25;35;25" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Speed lines -->
  <line x1="180" y1="420" x2="180" y2="480" stroke="#f39c12" stroke-width="1.5" opacity="0.3"/>
  <line x1="220" y1="430" x2="220" y2="485" stroke="#e74c3c" stroke-width="1" opacity="0.2"/>
  <line x1="292" y1="430" x2="292" y2="485" stroke="#e74c3c" stroke-width="1" opacity="0.2"/>
  <line x1="332" y1="420" x2="332" y2="480" stroke="#f39c12" stroke-width="1.5" opacity="0.3"/>

  <!-- Title -->
  <text x="256" y="478" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="600" fill="#f39c12" letter-spacing="5" opacity="0.8">GARGANTUA</text>
</svg>

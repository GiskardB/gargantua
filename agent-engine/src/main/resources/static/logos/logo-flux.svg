<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3cff"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#2d3cff"/>
    </linearGradient>
    <linearGradient id="fg2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf6"/>
      <stop offset="100%" style="stop-color:#c5cae9"/>
    </linearGradient>
    <linearGradient id="fglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#2d3cff"/>
    </linearGradient>
    <filter id="fblur"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fblur2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="metal">
      <feSpecularLighting specularExponent="40" lighting-color="#ffffff" result="spec">
        <fePointLight x="200" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
    </filter>
  </defs>

  <!-- Light metallic background -->
  <rect width="512" height="512" rx="60" fill="url(#fg2)"/>

  <!-- Outer casing (flux capacitor housing) -->
  <rect x="80" y="60" width="352" height="392" rx="30" fill="#dde1e8" stroke="#b0b8c4" stroke-width="3"/>
  <rect x="95" y="75" width="322" height="362" rx="22" fill="#f0f2f7" stroke="#c8cdd5" stroke-width="1.5"/>

  <!-- The Y shape — the iconic flux capacitor element -->
  <!-- Center point -->
  <circle cx="256" cy="260" r="20" fill="url(#fglow)" filter="url(#fblur)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="260" r="10" fill="white"/>

  <!-- Three arms of the Y -->
  <!-- Top arm -->
  <line x1="256" y1="260" x2="256" y2="120" stroke="url(#fg1)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <circle cx="256" cy="120" r="14" fill="#00d4ff" filter="url(#fblur)">
    <animate attributeName="r" values="10;16;10" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="120" r="7" fill="white"/>

  <!-- Bottom-left arm -->
  <line x1="256" y1="260" x2="155" y2="380" stroke="url(#fg1)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite" begin="0.27s"/>
  </line>
  <circle cx="155" cy="380" r="14" fill="#2d3cff" filter="url(#fblur)">
    <animate attributeName="r" values="10;16;10" dur="0.8s" repeatCount="indefinite" begin="0.27s"/>
  </circle>
  <circle cx="155" cy="380" r="7" fill="white"/>

  <!-- Bottom-right arm -->
  <line x1="256" y1="260" x2="357" y2="380" stroke="url(#fg1)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite" begin="0.54s"/>
  </line>
  <circle cx="357" cy="380" r="14" fill="#00d4ff" filter="url(#fblur)">
    <animate attributeName="r" values="10;16;10" dur="0.8s" repeatCount="indefinite" begin="0.54s"/>
  </circle>
  <circle cx="357" cy="380" r="7" fill="white"/>

  <!-- Energy bolts traveling along arms -->
  <circle cx="256" cy="190" r="4" fill="white" opacity="0.9">
    <animate attributeName="cy" values="260;120;260" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="205" cy="320" r="4" fill="white" opacity="0.9">
    <animate attributeName="cx" values="256;155;256" dur="0.8s" repeatCount="indefinite" begin="0.27s"/>
    <animate attributeName="cy" values="260;380;260" dur="0.8s" repeatCount="indefinite" begin="0.27s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="0.27s"/>
  </circle>
  <circle cx="307" cy="320" r="4" fill="white" opacity="0.9">
    <animate attributeName="cx" values="256;357;256" dur="0.8s" repeatCount="indefinite" begin="0.54s"/>
    <animate attributeName="cy" values="260;380;260" dur="0.8s" repeatCount="indefinite" begin="0.54s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="0.54s"/>
  </circle>

  <!-- G in the center -->
  <text x="256" y="272" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="800" fill="#2d3cff">G</text>

  <!-- Labels on the arms like the movie prop -->
  <text x="270" y="155" font-family="'Courier New',monospace" font-size="10" fill="#5c6bc0" transform="rotate(-90 270 155)">SKILLS</text>
  <text x="176" y="355" font-family="'Courier New',monospace" font-size="10" fill="#5c6bc0" transform="rotate(55 176 355)">TOOLS</text>
  <text x="340" y="355" font-family="'Courier New',monospace" font-size="10" fill="#5c6bc0" transform="rotate(-55 340 355)">MEMORY</text>

  <!-- Bottom plate text -->
  <text x="256" y="435" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" font-weight="700" fill="#3949ab" letter-spacing="3">GARGANTUA</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#7986cb" letter-spacing="1">FLUX ORCHESTRATOR</text>

  <!-- Corner screws (like the movie prop) -->
  <circle cx="110" cy="90" r="6" fill="#b0b8c4" stroke="#9aa4b0" stroke-width="1.5"/>
  <circle cx="402" cy="90" r="6" fill="#b0b8c4" stroke="#9aa4b0" stroke-width="1.5"/>
  <circle cx="110" cy="422" r="6" fill="#b0b8c4" stroke="#9aa4b0" stroke-width="1.5"/>
  <circle cx="402" cy="422" r="6" fill="#b0b8c4" stroke="#9aa4b0" stroke-width="1.5"/>
</svg>

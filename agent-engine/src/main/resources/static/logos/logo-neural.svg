<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ng1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9"/>
      <stop offset="100%" style="stop-color:#0984e3"/>
    </linearGradient>
    <linearGradient id="ng2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9"/>
      <stop offset="50%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#0984e3"/>
    </linearGradient>
    <filter id="nglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0a0a12"/>

  <!-- Brain shape (stylized) -->
  <path d="M256 100 C180 100, 120 150, 120 220 C120 260, 140 290, 170 310 C150 330, 145 360, 160 390 C175 420, 210 440, 256 440 C302 440, 337 420, 352 390 C367 360, 362 330, 342 310 C372 290, 392 260, 392 220 C392 150, 332 100, 256 100Z"
        fill="none" stroke="url(#ng2)" stroke-width="3" opacity="0.6"/>

  <!-- Brain folds -->
  <path d="M256 130 C256 130, 200 180, 256 230 C312 180, 256 130, 256 130" fill="none" stroke="#00cec9" stroke-width="2" opacity="0.4"/>
  <path d="M180 220 C180 220, 230 260, 180 310" fill="none" stroke="#0984e3" stroke-width="2" opacity="0.4"/>
  <path d="M332 220 C332 220, 282 260, 332 310" fill="none" stroke="#00cec9" stroke-width="2" opacity="0.4"/>

  <!-- Data flow streams (representing the pipeline) -->
  <path d="M60 256 Q120 200 180 256 Q240 312 300 256 Q360 200 420 256" fill="none" stroke="#00cec9" stroke-width="2.5" opacity="0.5" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M60 280 Q120 224 180 280 Q240 336 300 280 Q360 224 420 280" fill="none" stroke="#6c5ce7" stroke-width="2" opacity="0.3" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Central G -->
  <text x="256" y="295" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="160" font-weight="800" fill="url(#ng1)" filter="url(#nglow)">G</text>

  <!-- Pulse nodes -->
  <circle cx="130" cy="256" r="6" fill="#00cec9" opacity="0.9">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="382" cy="256" r="6" fill="#0984e3" opacity="0.9">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="256" cy="130" r="5" fill="#6c5ce7" opacity="0.8">
    <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="256" cy="400" r="5" fill="#00cec9" opacity="0.8">
    <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Title -->
  <text x="256" y="478" text-anchor="middle" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="300" fill="#00cec9" letter-spacing="6" opacity="0.7">GARGANTUA</text>
</svg>

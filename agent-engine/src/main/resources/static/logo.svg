<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff"/>
      <stop offset="100%" style="stop-color:#00bfff"/>
    </linearGradient>
    <linearGradient id="blue2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfff"/>
      <stop offset="100%" style="stop-color:#1e90ff"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffeaa7"/>
      <stop offset="100%" style="stop-color:#fdcb6e"/>
    </radialGradient>
    <radialGradient id="planet1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#74b9ff"/>
      <stop offset="100%" style="stop-color:#0984e3"/>
    </radialGradient>
    <radialGradient id="planet2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#55efc4"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </radialGradient>
    <radialGradient id="planet3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#fd79a8"/>
      <stop offset="100%" style="stop-color:#e84393"/>
    </radialGradient>
    <radialGradient id="planet4" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ffeaa7"/>
      <stop offset="100%" style="stop-color:#f39c12"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starglow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Tiny background stars -->
  <circle cx="80" cy="90" r="1" fill="white" opacity="0.5"/>
  <circle cx="420" cy="70" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="60" cy="310" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="440" cy="340" r="1" fill="white" opacity="0.3"/>
  <circle cx="150" cy="430" r="1" fill="white" opacity="0.4"/>
  <circle cx="380" cy="440" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="110" cy="170" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="400" cy="160" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="60" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="340" cy="450" r="1" fill="white" opacity="0.3"/>
  <circle cx="460" cy="240" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="50" cy="220" r="1" fill="white" opacity="0.3"/>

  <!-- Orbit 4 — outermost — the "G" orbit -->
  <ellipse cx="256" cy="256" rx="195" ry="195" fill="none" stroke="#1e90ff" stroke-width="1" opacity="0.15"/>

  <!-- Orbit 3 -->
  <ellipse cx="256" cy="256" rx="145" ry="145" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.2"/>

  <!-- Orbit 2 -->
  <ellipse cx="256" cy="256" rx="100" ry="100" fill="none" stroke="#1e90ff" stroke-width="1" opacity="0.25"/>

  <!-- Orbit 1 — innermost -->
  <ellipse cx="256" cy="256" rx="58" ry="58" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.3"/>

  <!-- Central star (the LLM core) -->
  <circle cx="256" cy="256" r="22" fill="url(#star)" filter="url(#starglow)">
    <animate attributeName="r" values="20;24;20" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="12" fill="#fff5cc"/>

  <!-- Planet 1 — innermost orbit, small (Skills) -->
  <circle cx="314" cy="256" r="8" fill="url(#planet1)">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet 2 — second orbit, medium (Tools) -->
  <circle cx="256" cy="156" r="12" fill="url(#planet2)">
    <animateTransform attributeName="transform" type="rotate" from="60 256 256" to="420 256 256" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet 3 — third orbit, larger (Memory) -->
  <circle cx="111" cy="256" r="16" fill="url(#planet3)">
    <animateTransform attributeName="transform" type="rotate" from="180 256 256" to="540 256 256" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- Planet 4 — outermost orbit, largest (Guardrails) with ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 256 256" to="630 256 256" dur="45s" repeatCount="indefinite"/>
    <circle cx="256" cy="61" r="20" fill="url(#planet4)"/>
    <!-- Saturn-like ring -->
    <ellipse cx="256" cy="61" rx="30" ry="6" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- The "G" — placed on the outermost orbit path, glowing blue -->
  <text x="256" y="284" text-anchor="middle"
        font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif"
        font-size="160" font-weight="800"
        fill="url(#blue1)" filter="url(#glow)"
        opacity="0.9">G</text>

  <!-- Subtle outer ring glow -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#1e90ff" stroke-width="0.5" opacity="0.15"/>

  <!-- "GARGANTUA" text -->
  <text x="256" y="480" text-anchor="middle"
        font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif"
        font-size="20" font-weight="300"
        fill="#4dabf7" letter-spacing="6" opacity="0.7">GARGANTUA</text>
</svg>

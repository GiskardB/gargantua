<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient principale viola -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <!-- Gradient cerchio interno -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f14"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6c5ce7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGrad)" filter="url(#shadow)"/>

  <!-- Inner dark circle -->
  <circle cx="256" cy="256" r="200" fill="url(#innerGrad)"/>

  <!-- Orbital rings (representing orchestration/pipeline) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#6c5ce7" stroke-width="2" opacity="0.3" transform="rotate(-20 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#a29bfe" stroke-width="2" opacity="0.3" transform="rotate(40 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#6c5ce7" stroke-width="2" opacity="0.2" transform="rotate(-70 256 256)"/>

  <!-- Central "G" letter -->
  <text x="256" y="290" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="180" font-weight="800" fill="url(#mainGrad)" filter="url(#glow)">G</text>

  <!-- Neural nodes (representing skills/tools) -->
  <!-- Top node -->
  <circle cx="256" cy="100" r="12" fill="#a29bfe" opacity="0.9"/>
  <circle cx="256" cy="100" r="6" fill="#ffffff"/>

  <!-- Right node -->
  <circle cx="400" cy="200" r="10" fill="#6c5ce7" opacity="0.8"/>
  <circle cx="400" cy="200" r="5" fill="#ffffff"/>

  <!-- Bottom-right node -->
  <circle cx="380" cy="360" r="10" fill="#a29bfe" opacity="0.7"/>
  <circle cx="380" cy="360" r="5" fill="#ffffff"/>

  <!-- Bottom-left node -->
  <circle cx="132" cy="360" r="10" fill="#6c5ce7" opacity="0.7"/>
  <circle cx="132" cy="360" r="5" fill="#ffffff"/>

  <!-- Left node -->
  <circle cx="112" cy="200" r="10" fill="#a29bfe" opacity="0.8"/>
  <circle cx="112" cy="200" r="5" fill="#ffffff"/>

  <!-- Connection lines from nodes to center (representing the pipeline) -->
  <line x1="256" y1="112" x2="256" y2="190" stroke="#a29bfe" stroke-width="1.5" opacity="0.4"/>
  <line x1="390" y1="208" x2="330" y2="240" stroke="#6c5ce7" stroke-width="1.5" opacity="0.3"/>
  <line x1="372" y1="352" x2="310" y2="300" stroke="#a29bfe" stroke-width="1.5" opacity="0.3"/>
  <line x1="142" y1="352" x2="202" y2="300" stroke="#6c5ce7" stroke-width="1.5" opacity="0.3"/>
  <line x1="122" y1="208" x2="182" y2="240" stroke="#a29bfe" stroke-width="1.5" opacity="0.3"/>

  <!-- Subtle "agent" text below G -->
  <text x="256" y="340" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="300" fill="#8888a0" letter-spacing="8">AGENT</text>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.2"/>
</svg>

apiVersion: v1
kind: Service
metadata:
  name: {{ include "gargantua-parent.fullname" . }}
  labels:
    {{- include "gargantua-parent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "gargantua-parent.selectorLabels" . | nindent 4 }}

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/agent-example-weather
      REDIS_URL: redis://redis:6379
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-openai}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gpt-4o}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY}
      LLM_PRIMARY_ENDPOINT: ${LLM_PRIMARY_ENDPOINT:-}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-anthropic}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-claude-sonnet-4-20250514}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_ROUTING_PROVIDER: ${LLM_ROUTING_PROVIDER:-ollama}
      LLM_ROUTING_MODEL: ${LLM_ROUTING_MODEL:-phi4-mini}
      LLM_ROUTING_ENDPOINT: http://ollama:11434
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mongo-data:
  ollama-data:

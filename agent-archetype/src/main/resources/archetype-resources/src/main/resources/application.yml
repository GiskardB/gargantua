spring:
  application:
    name: ${artifactId}
  threads:
    virtual:
      enabled: true
  ${symbol_pound} Spring Boot 4 reorganised the MongoDB auto-configuration: the driver
  ${symbol_pound} reads `spring.mongodb.uri` (in `MongoAutoConfiguration`) while
  ${symbol_pound} Spring Data still reads `spring.data.mongodb.uri` (in
  ${symbol_pound} `DataMongoAutoConfiguration`). We set both because the framework
  ${symbol_pound} uses both layers — drop one or the other only if you know which
  ${symbol_pound} auto-configuration your app actually pulls in.
  mongodb:
    uri: ${symbol_dollar}{MONGODB_URI:mongodb://localhost:27017/${artifactId}}
  data:
    mongodb:
      uri: ${symbol_dollar}{MONGODB_URI:mongodb://localhost:27017/${artifactId}}
    redis:
      url: ${symbol_dollar}{REDIS_URL:redis://localhost:6379}

server:
  port: ${symbol_dollar}{SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

agent:
  llm:
    primary:
      provider: ${symbol_dollar}{LLM_PRIMARY_PROVIDER:openai}
      model: ${symbol_dollar}{LLM_PRIMARY_MODEL:gpt-4o}
      api-key: ${symbol_dollar}{LLM_PRIMARY_API_KEY:}
      endpoint: ${symbol_dollar}{LLM_PRIMARY_ENDPOINT:}
      temperature: ${symbol_dollar}{LLM_PRIMARY_TEMPERATURE:0.7}
      max-tokens: ${symbol_dollar}{LLM_PRIMARY_MAX_TOKENS:1000}
      ${symbol_pound} Azure OpenAI only — newer models (e.g. gpt-5.1) require
      ${symbol_pound} max_completion_tokens instead of max_tokens. When set, it
      ${symbol_pound} takes precedence over max-tokens for azure-openai.
      max-completion-tokens: ${symbol_dollar}{LLM_PRIMARY_MAX_COMPLETION_TOKENS:}
      ${symbol_pound} Azure OpenAI only — Foundry requires an api-version and (typically)
      ${symbol_pound} a deployment name distinct from the model id. Both are no-ops
      ${symbol_pound} when provider != azure-openai.
      api-version: ${symbol_dollar}{LLM_PRIMARY_API_VERSION:}
      deployment-name: ${symbol_dollar}{LLM_PRIMARY_DEPLOYMENT_NAME:}
    fallback:
      provider: ${symbol_dollar}{LLM_FALLBACK_PROVIDER:anthropic}
      model: ${symbol_dollar}{LLM_FALLBACK_MODEL:claude-sonnet-4-20250514}
      api-key: ${symbol_dollar}{LLM_FALLBACK_API_KEY:}
      endpoint: ${symbol_dollar}{LLM_FALLBACK_ENDPOINT:}
      api-version: ${symbol_dollar}{LLM_FALLBACK_API_VERSION:}
      deployment-name: ${symbol_dollar}{LLM_FALLBACK_DEPLOYMENT_NAME:}
    ${symbol_pound} Unset LLM_ROUTING_* and routing rides on the primary provider/model —
    ${symbol_pound} zero extra config needed to get started. Set LLM_ROUTING_* explicitly
    ${symbol_pound} only when you want routing on a separate (e.g. local/cheaper) model.
    routing-model:
      provider: ${symbol_dollar}{LLM_ROUTING_PROVIDER:${symbol_dollar}{LLM_PRIMARY_PROVIDER:openai}}
      model: ${symbol_dollar}{LLM_ROUTING_MODEL:${symbol_dollar}{LLM_PRIMARY_MODEL:gpt-4o}}
      api-key: ${symbol_dollar}{LLM_ROUTING_API_KEY:${symbol_dollar}{LLM_PRIMARY_API_KEY:}}
      endpoint: ${symbol_dollar}{LLM_ROUTING_ENDPOINT:${symbol_dollar}{LLM_PRIMARY_ENDPOINT:}}
      api-version: ${symbol_dollar}{LLM_ROUTING_API_VERSION:${symbol_dollar}{LLM_PRIMARY_API_VERSION:}}
      deployment-name: ${symbol_dollar}{LLM_ROUTING_DEPLOYMENT_NAME:${symbol_dollar}{LLM_PRIMARY_DEPLOYMENT_NAME:}}
      max-completion-tokens: ${symbol_dollar}{LLM_ROUTING_MAX_COMPLETION_TOKENS:${symbol_dollar}{LLM_PRIMARY_MAX_COMPLETION_TOKENS:}}
      temperature: 0.0
      max-tokens: 50

  skill:
    path: classpath:skills/
    hot-reload: false
    cache-ttl-minutes: 60

  routing:
    strategy: hybrid
    fallback-skill: default-skill
    semantic:
      threshold: 0.82

  memory:
    working:
      max-messages: 20
      ttl-minutes: 30
    episodic:
      max-summaries: 5
      ttl-days: 365
    knowledge:
      max-segments: 10
    composer:
      max-context-tokens: 3000

  guardrail:
    input:
      max-length-enabled: true
      max-length-chars: 2000
      prompt-injection-enabled: true
      pii-masking-enabled: true
    output:
      pii-masking-enabled: true
      schema-validation-enabled: true

  hitl:
    enabled: true
    default-ttl-minutes: 5

  cost-tracking:
    enabled: true
    retention-days: 365

  audit:
    enabled: true
    retention-days: 365

  dry-run:
    enabled: true

  chat-ui:
    enabled: true                 # Set to false to disable /chat web interface

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

logging:
  level:
    root: INFO
    ${package}: DEBUG

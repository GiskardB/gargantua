${symbol_pound} Environment variables:
${symbol_pound}
${symbol_pound}   MONGODB_URI              MongoDB connection string (default: mongodb://localhost:27017/...)
${symbol_pound}   REDIS_URL                Redis connection URL (default: redis://localhost:6379)
${symbol_pound}   SERVER_PORT              HTTP port (default: 8080)
${symbol_pound}
${symbol_pound}   LLM_PRIMARY_PROVIDER     Primary LLM: openai | azure-openai | anthropic (default: openai)
${symbol_pound}   LLM_PRIMARY_MODEL        Model name, e.g. gpt-4o, claude-sonnet-4-... (default: gpt-4o)
${symbol_pound}   LLM_PRIMARY_API_KEY      API key for the primary LLM provider (REQUIRED)
${symbol_pound}   LLM_PRIMARY_ENDPOINT     Base URL (required for azure-openai, optional otherwise)
${symbol_pound}   LLM_PRIMARY_TEMPERATURE  Sampling temperature 0.0-1.0 (default: 0.7)
${symbol_pound}   LLM_PRIMARY_MAX_TOKENS   Max response tokens (default: 1000)
${symbol_pound}
${symbol_pound}   LLM_FALLBACK_PROVIDER    Fallback provider when primary fails (default: anthropic)
${symbol_pound}   LLM_FALLBACK_MODEL       Fallback model name (default: claude-sonnet-4-20250514)
${symbol_pound}   LLM_FALLBACK_API_KEY     Fallback API key (optional)
${symbol_pound}
${symbol_pound}   LLM_PRIMARY_API_VERSION       Azure OpenAI service version, e.g. 2024-08-01-preview.
${symbol_pound}                                 Required when LLM_PRIMARY_PROVIDER=azure-openai.
${symbol_pound}   LLM_PRIMARY_DEPLOYMENT_NAME   Azure deployment name. Defaults to LLM_PRIMARY_MODEL when blank.
${symbol_pound}
${symbol_pound}   LLM_ROUTING_PROVIDER     Routing model provider (default: ollama / phi4-mini, local)
${symbol_pound}   LLM_ROUTING_MODEL        Routing model name (default: phi4-mini)
${symbol_pound}   LLM_ROUTING_API_KEY      Not needed for Ollama; set when routing on a cloud provider

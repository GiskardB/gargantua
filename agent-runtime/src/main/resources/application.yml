# ══════════════════════════════════════════════════════════════════════════════
# Gargantua Runtime — image defaults
#
# Everything here is a floor, not a policy. The loaded bundle overrides these,
# and the process environment overrides the bundle, so an operator can adjust a
# running agent without republishing its artifact.
# ══════════════════════════════════════════════════════════════════════════════

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gargantua-runtime
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gargantua}
  redis:
    url: ${REDIS_URL:redis://localhost:6379}

agent:
  llm:
    primary:
      provider: ${LLM_PRIMARY_PROVIDER:openai}
      model: ${LLM_PRIMARY_MODEL:gpt-4o}
      api-key: ${LLM_PRIMARY_API_KEY:}
      endpoint: ${LLM_PRIMARY_ENDPOINT:https://api.openai.com/v1}
    fallback:
      provider: ${LLM_FALLBACK_PROVIDER:anthropic}
      model: ${LLM_FALLBACK_MODEL:claude-sonnet-4-20250514}
      api-key: ${LLM_FALLBACK_API_KEY:}
    routing-model:
      provider: ${LLM_ROUTING_PROVIDER:ollama}
      model: ${LLM_ROUTING_MODEL:phi4-mini}
      endpoint: ${LLM_ROUTING_ENDPOINT:http://localhost:11434}
      api-key: ${LLM_ROUTING_API_KEY:}
  routing:
    strategy: ${ROUTING_STRATEGY:hybrid}
  audit:
    enabled: ${AGENT_AUDIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    ai.gargantua: ${LOG_LEVEL:INFO}

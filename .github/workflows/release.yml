# ══════════════════════════════════════════════════════════════════════════════
# Gargantua AI Agent Framework — Release
#
# Triggered by:
#   1. Push of a version tag (e.g. v1.0.0, v1.2.3)
#   2. Manual dispatch (workflow_dispatch)
#
# What it does:
#   1. Builds all modules
#   2. Runs all tests
#   3. Attaches the Runtime-mode executable jar to the GitHub Release
#      (java -jar it directly — no clone, no Maven build)
#   4. Builds and pushes the Runtime image to GHCR (ghcr.io/giskardb/gargantua-runtime)
#   5. Creates a GitHub Release with changelog
#
# Distribution: JitPack is the canonical consumer channel for the library
# jars. It builds the tag on demand the first time a consumer resolves it —
# no upload step from this workflow is required. Runtime mode's artifacts
# (the jar and the image) are published directly by this workflow instead,
# since they're meant to be downloaded and run, not depended on. See
# README.md for consumer setup.
# ══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave empty to use POM version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — build and test only, skip GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # For creating GitHub Releases
  packages: write    # For pushing the Runtime image to GHCR

env:
  MAVEN_OPTS: -Xmx1024m

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Step 1: Build, test, and create GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # ── Determine version ──────────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # ── Set version in all POMs if different from current ──────────────────
      - name: Set version in POMs
        if: steps.version.outputs.version != ''
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mvn versions:set -DnewVersion="${VERSION}" --batch-mode --no-transfer-progress
          mvn versions:commit --batch-mode --no-transfer-progress
          echo "All POMs set to version: ${VERSION}"

      # ── Build all framework modules ────────────────────────────────────────
      - name: Build
        run: >
          mvn clean install -DskipTests
          --batch-mode --no-transfer-progress

      # ── Run tests ──────────────────────────────────────────────────────────
      - name: Test
        run: >
          mvn test
          --batch-mode --no-transfer-progress

      # ── Prepare the Runtime-mode executable jar as a release asset ──────────
      # Two copies: one pinned to the version (for reproducible references),
      # one under a fixed name so /releases/latest/download/gargantua-runtime.jar
      # always resolves to whatever the newest release is.
      - name: Prepare Runtime jar artifact
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: |
          mkdir -p dist
          JAR=$(ls agent-runtime/target/agent-runtime-*.jar | grep -v sources | grep -v javadoc | head -1)
          cp "$JAR" "dist/gargantua-runtime-${{ steps.version.outputs.version }}.jar"
          cp "$JAR" "dist/gargantua-runtime.jar"
          ls -la dist/

      # ── Build and push the Runtime image to GHCR ─────────────────────────────
      # Self-contained build (agent-runtime/Dockerfile), same recipe documented
      # in the README — this just runs it in CI and publishes the result.
      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Runtime image
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-runtime/Dockerfile
          push: true
          tags: |
            ghcr.io/giskardb/gargantua-runtime:${{ steps.version.outputs.version }}
            ghcr.io/giskardb/gargantua-runtime:latest

      # ── Generate changelog ─────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%an)" >> changelog.md
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "### Maven Coordinates" >> changelog.md
          echo "" >> changelog.md
          echo "**Maven Central** (recommended for production):" >> changelog.md
          echo '```xml' >> changelog.md
          echo '<dependency>' >> changelog.md
          echo '  <groupId>io.github.giskardb</groupId>' >> changelog.md
          echo '  <artifactId>agent-engine</artifactId>' >> changelog.md
          echo "  <version>${{ steps.version.outputs.version }}</version>" >> changelog.md
          echo '</dependency>' >> changelog.md
          echo '```' >> changelog.md
          echo "" >> changelog.md
          echo "**JitPack** (snapshots, branch builds, intermediate tags):" >> changelog.md
          echo '```xml' >> changelog.md
          echo '<dependency>' >> changelog.md
          echo '  <groupId>com.github.giskardb.gargantua</groupId>' >> changelog.md
          echo '  <artifactId>agent-engine</artifactId>' >> changelog.md
          echo "  <version>v${{ steps.version.outputs.version }}</version>" >> changelog.md
          echo '</dependency>' >> changelog.md
          echo '```' >> changelog.md
          echo "" >> changelog.md
          echo "### Quick Start (via JitPack archetype)" >> changelog.md
          echo '```bash' >> changelog.md
          echo 'mvn archetype:generate \' >> changelog.md
          echo '  -DarchetypeGroupId=com.github.giskardb.gargantua \' >> changelog.md
          echo '  -DarchetypeArtifactId=agent-archetype \' >> changelog.md
          echo "  -DarchetypeVersion=v${{ steps.version.outputs.version }} \\" >> changelog.md
          echo '  -DarchetypeRepository=https://jitpack.io' >> changelog.md
          echo '```' >> changelog.md
          cat changelog.md

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Gargantua v${{ steps.version.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/gargantua-runtime-${{ steps.version.outputs.version }}.jar
            dist/gargantua-runtime.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Runtime mode** — download and run, no build:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -LO https://github.com/${{ github.repository }}/releases/latest/download/gargantua-runtime.jar" >> $GITHUB_STEP_SUMMARY
          echo 'java -jar gargantua-runtime.jar run my-agent.gbundle' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Or: \`docker run ghcr.io/giskardb/gargantua-runtime:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Library mode** — Maven Central (\`io.github.giskardb\`) and JitPack. Consumers resolve via JitPack on first request:" >> $GITHUB_STEP_SUMMARY
          echo "https://jitpack.io/#${{ github.repository }}/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

# ══════════════════════════════════════════════════════════════════════════════
# Gargantua AI Agent Framework — Release
#
# Triggered by:
#   1. Push of a version tag (e.g. v1.0.0, v1.2.3)
#   2. Manual dispatch (workflow_dispatch)
#
# What it does:
#   1. Builds all modules
#   2. Runs all tests
#   3. Creates a GitHub Release with changelog
#
# Distribution: JitPack is the canonical consumer channel. It builds the
# tag on demand the first time a consumer resolves it — no upload step
# from this workflow is required. See README.md for consumer setup.
# ══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave empty to use POM version.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — build and test only, skip GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # For creating GitHub Releases

env:
  MAVEN_OPTS: -Xmx1024m

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Step 1: Build, test, and create GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # ── Determine version ──────────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # ── Set version in all POMs if different from current ──────────────────
      - name: Set version in POMs
        if: steps.version.outputs.version != ''
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mvn versions:set -DnewVersion="${VERSION}" --batch-mode --no-transfer-progress
          mvn versions:commit --batch-mode --no-transfer-progress
          echo "All POMs set to version: ${VERSION}"

      # ── Build all framework modules ────────────────────────────────────────
      - name: Build
        run: >
          mvn clean install -DskipTests
          --batch-mode --no-transfer-progress

      # ── Run tests ──────────────────────────────────────────────────────────
      - name: Test
        run: >
          mvn test
          --batch-mode --no-transfer-progress

      # ── Generate changelog ─────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%an)" >> changelog.md
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "### Maven Coordinates (via JitPack)" >> changelog.md
          echo '```xml' >> changelog.md
          echo '<dependency>' >> changelog.md
          echo '    <groupId>com.github.giskardb.gargantua</groupId>' >> changelog.md
          echo '    <artifactId>agent-engine</artifactId>' >> changelog.md
          echo "    <version>${{ steps.version.outputs.version }}</version>" >> changelog.md
          echo '</dependency>' >> changelog.md
          echo '```' >> changelog.md
          echo "" >> changelog.md
          echo "### Quick Start" >> changelog.md
          echo '```bash' >> changelog.md
          echo 'mvn archetype:generate \' >> changelog.md
          echo '  -DarchetypeGroupId=com.github.giskardb.gargantua \' >> changelog.md
          echo '  -DarchetypeArtifactId=agent-archetype \' >> changelog.md
          echo "  -DarchetypeVersion=${{ steps.version.outputs.version }}" >> changelog.md
          echo '```' >> changelog.md
          cat changelog.md

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Gargantua v${{ steps.version.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Distribution" >> $GITHUB_STEP_SUMMARY
          echo "Consumers resolve via JitPack on first request. See:" >> $GITHUB_STEP_SUMMARY
          echo "https://jitpack.io/#${{ github.repository }}/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

# ══════════════════════════════════════════════════════════════════════════════
# Gargantua AI Agent Framework — CI Pipeline
#
# Runs on every push and pull request:
#   1. Builds all modules
#   2. Runs unit tests
#   3. Verifies SKILL.md linter
#   4. Caches Maven dependencies for speed
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Build & Test — runs on every push/PR
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21, 25 ]  # Test both minimum (21) and latest (25)
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Build all framework modules (skip agent-example-fitcoach since it's standalone)
      - name: Build framework modules
        run: >
          mvn clean install -DskipTests
          --batch-mode --no-transfer-progress
          -pl '!agent-example-fitcoach'

      # Build agent-example-fitcoach separately (it uses Spring Boot parent, not gargantua-parent)
      - name: Build agent-example-fitcoach
        run: >
          mvn clean compile -DskipTests
          --batch-mode --no-transfer-progress
          -f agent-example-fitcoach/pom.xml

      # Run unit tests on framework modules
      - name: Run tests
        run: >
          mvn test
          --batch-mode --no-transfer-progress
          -pl '!agent-example-fitcoach'

      # Run agent-example-fitcoach tests
      - name: Run agent-example-fitcoach tests
        run: >
          mvn test
          --batch-mode --no-transfer-progress
          -f agent-example-fitcoach/pom.xml
        continue-on-error: true  # Example tests may need infra

      # Upload test reports on failure
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Verify agent-core compiles as pure Java (no Spring deps)
  # ────────────────────────────────────────────────────────────────────────────
  verify-core-purity:
    name: Verify agent-core has zero Spring deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build agent-core only
        run: >
          mvn clean compile
          --batch-mode --no-transfer-progress
          -pl agent-core

      - name: Check no Spring imports in agent-core
        run: |
          if grep -r "import org.springframework" agent-core/src/main/java/; then
            echo "ERROR: agent-core must not depend on Spring!"
            exit 1
          fi
          echo "OK: agent-core is Spring-free"

      - name: Check no javax imports anywhere
        run: |
          if grep -r "import javax\." --include="*.java" .; then
            echo "ERROR: Found javax imports — must use jakarta!"
            exit 1
          fi
          echo "OK: no javax imports found"

# ══════════════════════════════════════════════════════════════════════════════
# Gargantua AI Agent Framework — CI Pipeline
#
# Runs on every push and pull request:
#   1. Builds all modules
#   2. Runs unit tests
#   3. Verifies SKILL.md linter
#   4. Caches Maven dependencies for speed
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Build & Test — runs on every push/PR
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21, 25 ]  # Test both minimum (21) and latest (25)
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Build all framework modules
      - name: Build framework modules
        run: >
          mvn clean install -DskipTests
          --batch-mode --no-transfer-progress

      # Run unit tests
      - name: Run tests
        run: >
          mvn test
          --batch-mode --no-transfer-progress

      # Upload test reports on failure
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Architectural constraints that are easy to violate accidentally.
  #
  # agent-core, agent-bundle and agent-mcp-client are Spring-free by design: the
  # first is the pure domain, the other two are consumed by both the engine
  # (library mode) and the standalone runtime, and must not assume either.
  # ────────────────────────────────────────────────────────────────────────────
  verify-core-purity:
    name: Verify Spring-free modules stay Spring-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Spring-free modules
        run: >
          mvn clean compile
          --batch-mode --no-transfer-progress
          -pl agent-core,agent-bundle,agent-mcp-client -am

      - name: Check no Spring imports in Spring-free modules
        run: |
          status=0
          for module in agent-core agent-bundle agent-mcp-client; do
            if grep -rn "import org.springframework" "$module/src/main/java/"; then
              echo "ERROR: $module must not depend on Spring!"
              status=1
            else
              echo "OK: $module is Spring-free"
            fi
          done
          exit $status

      - name: Check no javax imports anywhere
        run: |
          if grep -r "import javax\." --include="*.java" .; then
            echo "ERROR: Found javax imports — must use jakarta!"
            exit 1
          fi
          echo "OK: no javax imports found"
